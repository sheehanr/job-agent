name: Send test notification

# Run this from the Actions tab to send one real notification (your
# current top match, with working "Not a fit" buttons) to your phone.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      FEEDBACK_SECRET: ${{ secrets.FEEDBACK_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/test_notification.py
