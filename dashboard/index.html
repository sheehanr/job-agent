<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sheehan’s Job Agent</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23ff7a1a'/%3E%3Cpath d='M9 12h14v11a2 2 0 0 1-2 2H11a2 2 0 0 1-2-2zM13 12V9.5A1.5 1.5 0 0 1 14.5 8h3A1.5 1.5 0 0 1 19 9.5V12' fill='none' stroke='%231a0a00' stroke-width='2'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #060607; --panel: #0f1013; --field: #16181c; --text: #f1f2f4; --muted: #9ba1ab;
  --faint: #6a707a; --line: #1f2228; --line-strong: #30343c;
  --accent: #ff7a1a; --accent-ink: #1a0a00; --accent-soft: rgba(255, 122, 26, .14);
  --accent-glow: rgba(255, 122, 26, .55);
  --good: #34d77b; --good-soft: rgba(52, 215, 123, .13);
  --t2: #4da3ff; --t2-soft: rgba(77, 163, 255, .14);
  --t3: #b48cff; --t3-soft: rgba(180, 140, 255, .14);
  --warn: #f5c84c; --warn-soft: rgba(245, 200, 76, .12);
  --bad: #ff5c5c; --bad-soft: rgba(255, 92, 92, .12);
  --chip: #1a1d22; --shadow: 0 1px 0 rgba(255, 255, 255, .025) inset;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
button, input, select { font: inherit; color: inherit; }
.wrap { max-width: 980px; margin: 0 auto; padding: 20px 16px 64px; }
header { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
header h1 { font-size: 20px; margin: 0; letter-spacing: -.01em; display: flex; align-items: center; gap: 8px; }
header h1::before { content: ""; width: 10px; height: 10px; border-radius: 3px; background: var(--accent);
  box-shadow: 0 0 14px var(--accent-glow); }
header .meta { color: var(--muted); font-size: 13px; margin-left: auto; text-align: right; }
.linkbtn { background: none; border: 0; color: var(--muted); cursor: pointer; padding: 0; font-size: 13px; }
.linkbtn:hover { color: var(--text); }
nav.tabs { display: flex; gap: 4px; overflow-x: auto; border-bottom: 1px solid var(--line);
  margin-bottom: 14px; scrollbar-width: none; }
nav.tabs button { background: none; border: 0; padding: 9px 12px; cursor: pointer; color: var(--muted);
  border-bottom: 2px solid transparent; white-space: nowrap; font-weight: 500; }
nav.tabs button.on { color: var(--text); border-bottom-color: var(--accent); }
nav.tabs .n { color: var(--faint); font-weight: 400; margin-left: 4px; font-size: 13px; }
nav.tabs .sep { flex: none; width: 1px; background: var(--line-strong); margin: 9px 6px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.toolbar input[type=search] { flex: 1 1 220px; min-width: 0; }
.toolbar input, .toolbar select { background: var(--field); border: 1px solid var(--line);
  border-radius: 8px; padding: 7px 10px; }
.toolbar input:focus, .toolbar select:focus, .fb input:focus, .login input:focus {
  outline: none; border-color: var(--accent); }
.empty { color: var(--muted); text-align: center; padding: 48px 12px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
  padding: 14px 16px; margin-bottom: 10px; box-shadow: var(--shadow); transition: border-color .15s; }
.card:hover { border-color: var(--line-strong); }
.card.closed { opacity: .6; }
.top { display: flex; gap: 10px; align-items: flex-start; }
.titles { flex: 1; min-width: 0; }
.company { font-size: 13px; color: var(--muted); font-weight: 600; }
.title { font-size: 16px; font-weight: 600; margin-top: 1px; overflow-wrap: anywhere; }
.title a { color: var(--text); }
.title a:hover { color: var(--accent); text-decoration: none; }
.facts .old { color: var(--bad); }
.badges { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.badge { font-size: 12px; padding: 2px 8px; border-radius: 99px; background: var(--chip);
  color: var(--muted); white-space: nowrap; font-weight: 500; }
.badge.tier1 { background: var(--good-soft); color: var(--good); }
.badge.tier2 { background: var(--t2-soft); color: var(--t2); }
.badge.tier3 { background: var(--t3-soft); color: var(--t3); }
.badge.warn { background: var(--warn-soft); color: var(--warn); }
.badge.bad { background: var(--bad-soft); color: var(--bad); }
.facts { color: var(--muted); font-size: 13px; margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
.facts > span { background: var(--chip); border-radius: 6px; padding: 2px 8px; white-space: nowrap;
  max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.reason { margin-top: 8px; font-size: 14px; }
.reason.muted { color: var(--muted); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; align-items: center; }
.btn { border: 1px solid var(--line-strong); background: var(--field); border-radius: 8px; padding: 6px 12px;
  cursor: pointer; font-size: 14px; font-weight: 500; }
.btn:hover { border-color: var(--faint); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); text-decoration: none; }
.btn.small { padding: 4px 10px; font-size: 13px; }
.fb { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; width: 100%; }
.fb input { flex: 1 1 200px; min-width: 0; border: 1px solid var(--line); background: var(--field);
  border-radius: 8px; padding: 6px 10px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--field); padding: 6px 10px; cursor: pointer; font-size: 13px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.note { font-size: 13px; color: var(--muted); }
table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--line);
  border-radius: 12px; overflow: hidden; font-size: 14px; }
th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); }
th { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
tr:last-child td { border-bottom: 0; }
h2 { font-size: 15px; margin: 22px 0 8px; }
.scroll { overflow-x: auto; }
.login { max-width: 340px; margin: 18vh auto 0; background: var(--panel); border: 1px solid var(--line);
  border-radius: 14px; padding: 24px; }
.login h1 { font-size: 20px; margin: 0 0 14px; }
.login input { width: 100%; border: 1px solid var(--line); background: var(--field); border-radius: 8px;
  padding: 9px 11px; margin-bottom: 10px; }
.login .btn { width: 100%; padding: 9px; }
.err { color: var(--bad); font-size: 13px; min-height: 18px; }
.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--accent);
  color: var(--accent-ink); font-weight: 500; padding: 8px 14px; border-radius: 8px; font-size: 14px; opacity: 0; transition: opacity .2s;
  pointer-events: none; }
.toast.show { opacity: 1; pointer-events: auto; }
.toast button { background: none; border: 0; color: inherit; text-decoration: underline; cursor: pointer; margin-left: 8px; }
@media (max-width: 560px) {
  .top { flex-direction: column; }
  .badges { justify-content: flex-start; }
  header .meta { display: none; }
}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="empty">Loading...</div></div>
<div class="toast" id="toast"></div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
// Tabs in groups: the AI's inbox, where reviewed postings go, the archive.
const TAB_GROUPS = [
  [["matches", "Matches"], ["maybe", "Maybe"], ["skipped", "Skipped by AI"]],
  [["applied", "Applied"], ["not_fit", "Not interested"]],
  [["archive", "Archive"]],
];
const TIER_RANK = { 1: 0, 2: 1, 3: 2 };  // unknown tier sorts last
const params = new URLSearchParams(location.search);
const state = {
  tab: params.get("tab") || "matches",
  q: params.get("company") || "",
  term: "", source: "", sort: "posted_desc", newOnly: false, within: "",
  rows: {}, counts: {}, status: null, open: null,
};

async function api(path, opts = {}) {
  const r = await fetch(path, {
    ...opts,
    headers: { "Content-Type": "application/json" },
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  if (r.status === 401) { renderLogin(); throw new Error("signed out"); }
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || r.statusText);
  return data;
}

function toast(msg, undo) {
  const t = $("#toast");
  t.innerHTML = esc(msg) + (undo ? ' <button id="undo">Undo</button>' : "");
  t.classList.add("show");
  if (undo) $("#undo").onclick = () => { t.classList.remove("show"); undo(); };
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => t.classList.remove("show"), 5000);
}

function ago(iso) {
  if (!iso) return "";
  const s = (Date.now() - new Date(iso)) / 1000;
  if (s < 3600) return `${Math.max(1, Math.round(s / 60))}m ago`;
  if (s < 86400) return `${Math.round(s / 3600)}h ago`;
  return `${Math.round(s / 86400)}d ago`;
}

function postedTime(r) {
  return r.posted_at ? new Date(r.posted_at).getTime() : null;
}

// Sort by posting date; postings with no date always go last.
function byPosted(dir) {
  return (a, b) => {
    const x = postedTime(a), y = postedTime(b);
    if (x === null || y === null) return (x === null) - (y === null);
    return dir * (x - y);
  };
}

function postedLabel(r) {
  if (!r.posted_at) return { text: "Posting date unknown", old: false };
  const days = (Date.now() - new Date(r.posted_at)) / 86400000;
  const text = r.posted_approx ? `Posted ${Math.round(days)}+ days ago` : `Posted ${ago(r.posted_at)}`;
  return { text, old: days > 45 };
}

// ---- Location: every job site writes it differently ("USA - Pennsylvania -
// West Point", "US, Arizona, Phoenix", "Boston, Massachusetts, USA").
// Show "City, ST", at most two, and "+N" for the rest.
const STATES = { alabama: "AL", alaska: "AK", arizona: "AZ", arkansas: "AR", california: "CA",
  colorado: "CO", connecticut: "CT", delaware: "DE", "district of columbia": "DC", florida: "FL",
  georgia: "GA", hawaii: "HI", idaho: "ID", illinois: "IL", indiana: "IN", iowa: "IA", kansas: "KS",
  kentucky: "KY", louisiana: "LA", maine: "ME", maryland: "MD", massachusetts: "MA", michigan: "MI",
  minnesota: "MN", mississippi: "MS", missouri: "MO", montana: "MT", nebraska: "NE", nevada: "NV",
  "new hampshire": "NH", "new jersey": "NJ", "new mexico": "NM", "new york": "NY",
  "north carolina": "NC", "north dakota": "ND", ohio: "OH", oklahoma: "OK", oregon: "OR",
  pennsylvania: "PA", "rhode island": "RI", "south carolina": "SC", "south dakota": "SD",
  tennessee: "TN", texas: "TX", utah: "UT", vermont: "VT", virginia: "VA", washington: "WA",
  "west virginia": "WV", wisconsin: "WI", wyoming: "WY", "puerto rico": "PR" };
const STATE_CODES = new Set(Object.values(STATES));

// Country codes in locations ("CH - Adliswil", "Shanghai,CHN") shown as names.
const ISO3 = { CHN: "CN", IND: "IN", CAN: "CA", MEX: "MX", GBR: "GB", DEU: "DE", FRA: "FR",
  NLD: "NL", IRL: "IE", ISR: "IL", JPN: "JP", KOR: "KR", TWN: "TW", SGP: "SG", MYS: "MY",
  PHL: "PH", POL: "PL", ROU: "RO", HUN: "HU", CZE: "CZ", ITA: "IT", ESP: "ES", PRT: "PT",
  BRA: "BR", ARG: "AR", CRI: "CR", CHE: "CH", AUT: "AT", BEL: "BE", SWE: "SE", DNK: "DK",
  NOR: "NO", FIN: "FI", AUS: "AU", NZL: "NZ", VNM: "VN", THA: "TH", IDN: "ID", ARE: "AE" };
const REGION_NAMES = (() => { try { return new Intl.DisplayNames(["en"], { type: "region" }); } catch (e) { return null; } })();

const REGION_WORD_RE = /\b(district|province|prefecture|governorate|oblast|voivodeship|region|territory|canton|emirate)\b/i;

// Every country's English name, lowercased, for locations that spell it out.
const COUNTRY_NAMES = (() => {
  const names = {};
  if (!REGION_NAMES) return names;
  const A = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
  for (const a of A) for (const b of A) {
    try { const n = REGION_NAMES.of(a + b); if (n && n !== a + b) names[n.toLowerCase()] = n; } catch (e) { /* not a region */ }
  }
  return names;
})();

// Non-US places that postings often list with no country. Leaves out
// names shared with common US cities (Cambridge, Waterloo, Paris...).
const PLACE_COUNTRY = {
  India: ["bengaluru", "bangalore", "hyderabad", "pune", "chennai", "mumbai", "gurgaon", "gurugram",
    "noida", "new delhi", "delhi", "kolkata", "ahmedabad"],
  China: ["shanghai", "beijing", "shenzhen", "suzhou", "guangzhou", "chengdu", "hangzhou", "wuhan", "xi'an", "shenyang"],
  Canada: ["toronto", "vancouver", "montreal", "montréal", "mississauga", "calgary", "ottawa", "markham",
    "ontario", "quebec", "québec", "british columbia", "alberta", "nova scotia", "manitoba"],
  "United Kingdom": ["london", "manchester", "edinburgh", "glasgow", "bristol", "belfast", "reading", "england", "scotland", "wales"],
  Ireland: ["dublin", "cork", "galway", "limerick", "shannon", "carrigtwohill"],
  Poland: ["krakow", "kraków", "warsaw", "warszawa", "wroclaw", "wrocław", "gdansk", "gdańsk", "lodz", "łódź"],
  Germany: ["munich", "münchen", "berlin", "frankfurt", "hamburg", "erlangen", "forchheim", "stuttgart"],
  France: ["lyon", "grenoble", "sophia antipolis", "toulouse", "valbonne"],
  Netherlands: ["amsterdam", "eindhoven", "utrecht", "rotterdam", "veldhoven", "maastricht"],
  Switzerland: ["zurich", "zürich", "geneva", "basel", "adliswil", "lausanne"],
  Israel: ["tel aviv", "haifa", "herzliya", "petah tikva", "petah-tikva", "jerusalem", "yokneam"],
  Japan: ["tokyo", "osaka", "yokohama"], "South Korea": ["seoul"], Taiwan: ["taipei", "hsinchu"],
  Singapore: ["singapore"], Malaysia: ["penang", "kulim", "kuala lumpur", "selangor", "johor", "subang"],
  Vietnam: ["ho chi minh city", "hanoi"], Philippines: ["manila", "baguio city", "cebu"],
  Thailand: ["bangkok"], Indonesia: ["jakarta"], Australia: ["sydney", "melbourne", "brisbane"],
  Mexico: ["mexico city", "guadalajara", "tijuana", "monterrey", "juarez", "juárez"],
  Brazil: ["são paulo", "sao paulo", "campinas", "varginha", "belo horizonte"], "Costa Rica": ["heredia", "alajuela", "cartago"],
  Hungary: ["budapest"], Romania: ["bucharest", "cluj-napoca", "iasi"], "Czechia": ["prague", "brno"],
  Italy: ["milan", "milano", "rome", "turin", "rivalta di torino"], Spain: ["madrid", "barcelona"],
  Sweden: ["stockholm"], Denmark: ["copenhagen"], Finland: ["helsinki"], Belgium: ["brussels"],
};
// Big US tech cities that postings list with no state.
const US_CITY_STATE = { "san francisco": "CA", "san jose": "CA", "seattle": "WA", "austin": "TX",
  "new york city": "NY", "new york": "NY", "boston": "MA", "chicago": "IL", "los angeles": "CA",
  "mountain view": "CA", "sunnyvale": "CA", "palo alto": "CA", "menlo park": "CA", "redmond": "WA",
  "bellevue": "WA", "san diego": "CA", "denver": "CO", "atlanta": "GA", "pittsburgh": "PA",
  "waltham": "MA", "lehi": "UT", "madison": "WI", "niskayuna": "NY", "rensselaer": "NY" };
const PLACE_TO_COUNTRY = Object.fromEntries(
  Object.entries(PLACE_COUNTRY).flatMap(([country, places]) => places.map((p) => [p, country])));

function countryName(code) {
  const iso2 = ISO3[code] || code;
  if (!REGION_NAMES || iso2.length !== 2) return "";
  try {
    const name = REGION_NAMES.of(iso2);
    return name && name !== iso2 ? name : "";
  } catch (e) { return ""; }
}
const COUNTRY_RE = /\b(united states of america|united states|usa|u\.s\.a?\.?)\b|(^|[\s,-])US(?=$|[\s,-])/gi;

// Shorthands Simplify writes instead of a city.
const SHORTHANDS = { sf: "San Francisco, CA", "south sf": "South San Francisco, CA",
  nyc: "New York, NY", "bay area": "San Francisco Bay Area, CA", dc: "Washington, DC",
  "washington dc": "Washington, DC", "washington d.c.": "Washington, DC" };

function shortPlace(raw) {
  // Full street address ("..., Kennesaw, GA, 30144 USA"): city and state
  // just before the ZIP code.
  const addr = String(raw || "").match(/([A-Za-z .'-]+),\s*([A-Z]{2}),?\s*\d{5}\b/);
  if (addr && STATE_CODES.has(addr[2])) return `${addr[1].trim()}, ${addr[2]}`;
  let s = String(raw || "").replace(/\(.*?\)/g, " ").trim();
  s = s.replace(/^[A-Z]{2,5}\d{0,3}:\s*/, "");                       // "CAP25: ..." site codes
  s = s.replace(/\s+:\s+.*$/, "");                                   // "Madison : 1 Exact Lane"
  s = s.replace(/^.*>\s*/, "");                                      // "United States > Madison"
  s = s.replace(/^US-([A-Z]{2})-([^,]+).*$/, "$2, $1");              // "US-CA-Menlo Park"
  s = s.replace(/^([A-Za-z .]+?)-([A-Z]{2})-.*$/, "$1, $2");          // "Seattle-WA-2nd Ave"
  if (s === s.toUpperCase() && /[A-Z]{3}/.test(s) && /\s/.test(s)) {  // "SAN JOSE"
    s = s.toLowerCase().replace(/\b\w/g, (c) => c.toUpperCase());
  }
  if (!s) return "";
  if (/remote/i.test(s)) return "Remote";
  const short = SHORTHANDS[s.toLowerCase().replace(/,/g, "").replace(/\s+/g, " ")];
  if (short) return short;
  // "Washington, DC" / "Washington D.C., USA": the city, not the state.
  if (/\bwashington,?\s*d\.?\s?c\b|\bdistrict of columbia\b/i.test(s)) return "Washington, DC";
  const hadUS = new RegExp(COUNTRY_RE.source, "i").test(s);
  s = s.replace(COUNTRY_RE, " ");
  // Split on commas and on spaced dashes (" - "), not on "In-Office".
  const parts = s.split(/\s*,\s*|\s+[-–|]\s+/).map((x) => x.trim()).filter(Boolean);
  let state = "", city = "", country = "";
  for (const [i, part] of parts.entries()) {
    const low = part.toLowerCase();
    if (!state && STATES[low]) { state = STATES[low]; continue; }
    // A trailing two-letter code after a non-US region ("Haifa, Haifa
    // District, IL", "Hyderabad, TS, IN") or after a known non-US city
    // ("Haifa, IL") is a country, even when it looks like a state code.
    if (!country && i === parts.length - 1 && part.length === 2 && countryName(part) && i > 0 &&
        (REGION_WORD_RE.test(parts[i - 1]) ||
         (/^[A-Z]{2}$/.test(parts[i - 1]) && !STATE_CODES.has(parts[i - 1])) ||
         PLACE_TO_COUNTRY[parts[0].toLowerCase()] === countryName(part))) {
      country = countryName(part); state = ""; continue;
    }
    // A two-letter code is a state right after the city, last ("Kingwood,
    // Houston, TX"), or when the location says US - but not after another
    // code ("Hyderabad, TS, IN" is India, not Indiana).
    const afterCode = i > 0 && parts[i - 1].length === 2;
    const isLast = i === parts.length - 1;
    if (!state && part.length === 2 && STATE_CODES.has(part.toUpperCase()) &&
        (i <= 1 || hadUS || (isLast && !afterCode))) {
      state = part.toUpperCase(); continue;
    }
    if (!country && /^[A-Z]{2,3}$/.test(part) && countryName(part)) { country = countryName(part); continue; }
    if (!country && COUNTRY_NAMES[low] && !STATES[low]) { country = COUNTRY_NAMES[low]; continue; }
    const pre = part.match(/^([A-Z]{2})\s+(.+)$/);
    if (!state && pre && STATE_CODES.has(pre[1])) { state = pre[1]; if (!city) city = pre[2]; continue; }
    if (!city) city = part;
  }
  if (city && state) return `${city}, ${state}`;
  if (state) {
    const name = Object.keys(STATES).find((k) => STATES[k] === state) || state;
    return `${name.replace(/\b\w/g, (c) => c.toUpperCase())}, US`;
  }
  if (city && country) return `${city}, ${country}`;
  // No state and no country given: look the place up.
  const usState = city && !country && US_CITY_STATE[city.toLowerCase()];
  if (usState) return `${city}, ${usState}`;
  const guess = !hadUS && (PLACE_TO_COUNTRY[(city || "").toLowerCase()] ||
    parts.map((x) => PLACE_TO_COUNTRY[x.toLowerCase()]).find(Boolean));
  if (city && guess) return city.toLowerCase() === guess.toLowerCase() || PLACE_COUNTRY[guess].includes(city.toLowerCase()) && ["ontario", "quebec", "québec", "british columbia", "alberta", "nova scotia", "manitoba", "england", "scotland", "wales", "singapore"].includes(city.toLowerCase())
    ? guess : `${city}, ${guess}`;
  return city || country || (hadUS ? "United States" : String(raw));
}

// Formatted by the AI ("Los Angeles, CA", "Taipei, Taiwan"); the local
// parser is only a fallback for the odd posting that has none yet.
function placesOf(r) {
  // An empty list means the AI found no real place (just site codes).
  if (Array.isArray(r.places)) return [...new Set(r.places)];
  const all = (r.locations || []).flatMap((l) => String(l).split(/\s*;\s*/)).map(shortPlace).filter(Boolean);
  return [...new Set(all)];
}

function locationChip(r) {
  const places = placesOf(r);
  if (!places.length) return `<span>Location not listed</span>`;
  const shown = places.slice(0, 2).join(" · ") + (places.length > 2 ? ` +${places.length - 2}` : "");
  return `<span title="${esc((r.locations || []).join("; "))}">${esc(shown)}</span>`;
}

// ---- Pay: postings give it per hour, week, month or year. Show it per
// hour; converted amounts get a "~" and the original on hover.
function payChip(raw) {
  if (!raw) return `<span>Pay not listed</span>`;
  const text = String(raw);
  if (!text.includes("$")) return `<span>${esc(text)}</span>`;
  const nums = [...text.matchAll(/(\d[\d,]*(?:\.\d+)?)\s*(k)?\b/gi)]
    .map((m) => parseFloat(m[1].replace(/,/g, "")) * (m[2] ? 1000 : 1)).filter((n) => n > 0);
  if (!nums.length) return `<span>${esc(text)}</span>`;
  const t = text.toLowerCase();
  let per = /\b(hr|hour|hourly)\b/.test(t) ? 1
    : /\b(week|weekly|wk)\b/.test(t) ? 40
    : /\b(month|monthly|mo)\b/.test(t) ? 2080 / 12
    : /\b(yr|year|yearly|annual|annually|salary)\b/.test(t) ? 2080
    : /stipend|once|bonus/.test(t) ? null : 0;
  if (per === null) return `<span>${esc(text)}</span>`;
  if (per === 0) {
    const top = Math.max(...nums);
    per = top < 300 ? 1 : top < 25000 ? 2080 / 12 : 2080;
  }
  const hourly = nums.slice(0, 2).map((n) => Math.round(n / per));
  const range = hourly.length > 1 && hourly[0] !== hourly[1] ? `$${hourly[0]}–${hourly[1]}` : `$${hourly[0]}`;
  return per === 1 ? `<span>${range}/hr</span>`
    : `<span title="Converted to hourly from: ${esc(text)}">~${range}/hr</span>`;
}

const SEASONS = { Winter: 0, Spring: 1, Summer: 2, Fall: 3 };

// Every term a posting is for, e.g. ["Summer 2027", "Fall 2027"].
function termsOf(r) {
  const t = termOf(r);
  return t === "Term not listed" ? [] : t.split(/,\s*/).filter(Boolean);
}

function termOptions() {
  const all = new Set();
  for (const r of state.rows[state.tab] || []) termsOf(r).forEach((t) => all.add(t));
  return [...all].sort((a, b) => {
    const [sa, ya] = a.split(" "), [sb, yb] = b.split(" ");
    return (ya - yb) || ((SEASONS[sa] ?? 9) - (SEASONS[sb] ?? 9));
  });
}

function termOf(r) {
  const j = r.judgment || {};
  const t = j.term && !/unspecified|unknown/i.test(j.term) ? j.term : (r.terms || []).filter((x) => x && x !== "N/A").join(", ");
  return t || "Term not listed";
}

function renderLogin() {
  $("#app").innerHTML = `
    <form class="login" id="login">
      <h1>Sheehan’s Job Agent</h1>
      <input type="password" id="pw" placeholder="Password" autocomplete="current-password" autofocus>
      <div class="err" id="err"></div>
      <button class="btn primary">Sign in</button>
    </form>`;
  $("#login").onsubmit = async (e) => {
    e.preventDefault();
    const r = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: $("#pw").value }) });
    if (r.ok) start(); else $("#err").textContent = "Wrong password";
  };
}

function shell() {
  const last = state.status?.runs?.find((r) => r.finished_at);
  $("#app").innerHTML = `
    <header>
      <h1>Sheehan’s Job Agent</h1>
      <div class="meta">${last ? `Last checked ${ago(last.finished_at)}` : ""}<br>
        <button class="linkbtn" id="statuslink">Tracker status</button> ·
        <button class="linkbtn" id="signout">Sign out</button></div>
    </header>
    <nav class="tabs">${TAB_GROUPS.map((group) => group.map(([k, label]) =>
      `<button data-tab="${k}" class="${k === state.tab ? "on" : ""}">${label}${
        state.counts[k] != null ? `<span class="n">${state.counts[k]}</span>` : ""}</button>`).join("")
    ).join('<span class="sep"></span>')}</nav>
    <div id="body"></div>`;
  document.querySelectorAll("nav.tabs button").forEach((b) => (b.onclick = () => switchTab(b.dataset.tab)));
  $("#signout").onclick = async () => { await fetch("/api/login", { method: "DELETE" }); renderLogin(); };
  $("#statuslink").onclick = () => switchTab("status");
}

async function switchTab(tab) {
  state.tab = tab; state.open = null;
  history.replaceState(null, "", tab === "matches" ? location.pathname : `?tab=${tab}`);
  shell();
  if (tab === "status") return renderCoverage();
  if (!state.rows[tab]) await load(tab);
  renderList();
}

async function load(tab) {
  $("#body").innerHTML = `<div class="empty">Loading...</div>`;
  const data = await api(`/api/postings?view=${tab}`);
  state.rows[tab] = data.rows;
  shell();
}

// Every tab's number, from the server (refreshed after each action).
async function loadCounts() {
  try {
    state.counts = await api("/api/counts");
    document.querySelectorAll("nav.tabs button").forEach((b) => {
      const n = state.counts[b.dataset.tab];
      let span = b.querySelector(".n");
      if (n == null) return;
      if (!span) { span = document.createElement("span"); span.className = "n"; b.appendChild(span); }
      span.textContent = n;
    });
  } catch (e) { /* counts are a nicety */ }
}

function filtered() {
  let rows = state.rows[state.tab] || [];
  const q = state.q.trim().toLowerCase();
  if (q) rows = rows.filter((r) => `${r.company} ${r.title} ${(r.locations || []).join(" ")} ${r.judgment?.reason || ""}`.toLowerCase().includes(q));
  if (state.term) rows = rows.filter((r) => state.term === "none" ? !termsOf(r).length : termsOf(r).includes(state.term));
  if (state.source) rows = rows.filter((r) => state.source === "simplify" ? r.source === "simplify" : r.source !== "simplify");
  if (state.newOnly) rows = rows.filter((r) => !r.baseline);
  if (state.within) {
    const cutoff = Date.now() - Number(state.within) * 86400000;
    rows = rows.filter((r) => r.posted_at && new Date(r.posted_at).getTime() >= cutoff);
  }
  rows = [...rows];
  const found = (r) => new Date(r.first_seen).getTime();
  const sorts = {
    posted_desc: byPosted(-1),
    posted_asc: byPosted(1),
    found_desc: (a, b) => found(b) - found(a),
    found_asc: (a, b) => found(a) - found(b),
    tier: (a, b) => (TIER_RANK[a.tier] ?? 3) - (TIER_RANK[b.tier] ?? 3) || byPosted(-1)(a, b),
  };
  const order = sorts[state.sort] || sorts.posted_desc;
  // Closed postings always go to the bottom, whatever the sort.
  rows.sort((a, b) => (a.active === false) - (b.active === false) || order(a, b));
  return rows;
}

function card(r) {
  const j = r.judgment || {};
  const tier = r.tier ? `<span class="badge tier${r.tier}" title="Company tier (see profile.md)">Tier ${r.tier}</span>` : "";
  const badges = [tier,
    r.description_status === "unavailable" ? `<span class="badge warn" title="Couldn't read the description; judged from the title">Unverified</span>` : "",
    !r.active ? `<span class="badge bad">Closed</span>` : "",
    r.baseline ? "" : `<span class="badge">New</span>`].join("");
  const posted = postedLabel(r);
  const facts = [
    locationChip(r),
    `<span>${esc(termOf(r))}</span>`,
    payChip(j.pay),
    `<span class="${posted.old ? "old" : ""}" title="When the company posted it">${posted.text}</span>`,
    `<span>via ${r.source === "simplify" ? "Simplify" : "company site"}</span>`,
  ].filter(Boolean).join("");
  const reason = j.final_reason || j.reason || "";
  const fbNote = r.user_status === "not_fit"
    ? `<div class="note">Not interested: the ${r.feedback_kind === "company" ? "company" : "role"}${r.feedback_reason ? ` - ${esc(r.feedback_reason)}` : ""}</div>` : "";
  const applied = r.user_status === "applied" ? `<div class="note">Applied ${ago(r.applied_at)}</div>`
    : r.user_status === "good_fit" ? `<div class="note">You marked this as interested (the AI had turned it down)</div>`
    : r.user_status === "skipped" ? `<div class="note">Archived ${ago(r.feedback_at)}</div>` : "";

  const openBtn = (primary) =>
    `<a class="btn ${primary ? "primary" : ""}" href="${esc(r.url)}" target="_blank" rel="noopener">Open posting</a>`;
  let actions;
  if (!r.user_status && r.verdict === "skip") {
    // Turned down by the AI: you can apply anyway, mark it Interested, or archive it.
    actions = `${openBtn(true)}
      <button class="btn" data-act="applied">Applied</button>
      <button class="btn" data-act="goodfit">Interested</button>
      <button class="btn" data-act="skip">Archive</button>`;
  } else if (!r.user_status) {
    actions = `${openBtn(true)}
      <button class="btn" data-act="applied">Applied</button>
      <button class="btn" data-act="notfit">Not interested</button>
      <button class="btn" data-act="skip">Archive</button>`;
  } else if (r.user_status === "good_fit") {
    actions = `${openBtn(true)}
      <button class="btn" data-act="applied">Applied</button>
      <button class="btn small" data-act="undo">Undo</button>`;
  } else {
    actions = `${openBtn(false)}
      ${r.user_status === "not_fit" ? `<button class="btn small" data-act="reason">${r.feedback_reason ? "Edit reason" : "Add reason"}</button>` : ""}
      <button class="btn small" data-act="undo">Undo</button>`;
  }
  const open = state.open === r.id ? feedbackForm(r) : "";
  return `<div class="card ${r.active ? "" : "closed"}" data-id="${r.id}">
    <div class="top"><div class="titles"><div class="company">${esc(r.company)}</div>
      <div class="title"><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.title)}</a></div></div>
      <div class="badges">${badges}</div></div>
    <div class="facts">${facts}</div>
    ${reason ? `<div class="reason ${r.verdict === "skip" ? "muted" : ""}">${esc(reason)}</div>` : ""}
    ${fbNote}${applied}
    <div class="actions">${actions}${open}</div>
  </div>`;
}

function feedbackForm(r) {
  const editing = r.user_status === "not_fit";
  return `<div class="fb">
    ${editing ? "" : `<span class="seg"><button data-kind="role" class="on">The role</button><button data-kind="company">The company</button></span>`}
    <input type="text" maxlength="300" placeholder="Why? (optional, helps the filter learn)" value="${esc(r.feedback_reason || "")}">
    <button class="btn small primary" data-act="save">Save</button>
    <button class="btn small" data-act="cancel">Cancel</button>
  </div>`;
}

function renderList() {
  const rows = filtered();
  const blurb = {
    matches: "Postings the AI rated a good fit. Not interested teaches the AI to skip things like it; Archive just clears one. Dates in red are over 45 days old.",
    maybe: "Borderline postings: worth a look, not worth a notification. Archive clears one.",
    applied: "Postings you marked as applied. The AI treats these as examples of what you want.",
    not_fit: "Postings you marked as not interested. These teach the AI what to skip.",
    skipped: "Postings the AI read and turned down, with its reason. If it got one wrong, mark it Interested (or Applied) - both teach the AI what you want. Archive clears one without teaching it anything.",
    archive: "Postings you cleared without applying. The AI never sees these; Undo puts one back.",
  }[state.tab];
  $("#body").innerHTML = `
    <p class="note">${blurb}</p>
    <div class="toolbar">
      <input type="search" id="q" placeholder="Search company, role, location" value="${esc(state.q)}">
      <select id="term">
        <option value="">All terms</option>
        ${termOptions().map((t) => `<option value="${esc(t)}">${esc(t)}</option>`).join("")}
        <option value="none">Term not listed</option>
      </select>
      <select id="source"><option value="">All sources</option><option value="direct">Company sites</option><option value="simplify">Simplify</option></select>
      <select id="within"><option value="">Posted any time</option><option value="7">Posted this week</option>
        <option value="30">Posted last 30 days</option><option value="90">Posted last 90 days</option></select>
      <select id="sort">
        <option value="posted_desc">Newest posted</option><option value="posted_asc">Oldest posted</option>
        <option value="found_desc">Newest found</option><option value="found_asc">Oldest found</option>
        <option value="tier">Tier 1 first</option>
      </select>
      <label class="note" style="display:flex;align-items:center;gap:6px"><input type="checkbox" id="newOnly" ${state.newOnly ? "checked" : ""}> New since tracking started</label>
    </div>
    <div id="list">${rows.length ? rows.map(card).join("") : `<div class="empty">Nothing here${state.q || state.term || state.source ? " for these filters" : " yet"}.</div>`}</div>`;
  $("#term").value = state.term; $("#source").value = state.source; $("#sort").value = state.sort;
  $("#within").value = state.within;
  $("#within").onchange = (e) => { state.within = e.target.value; rerenderList(); };
  $("#q").oninput = (e) => { state.q = e.target.value; rerenderList(); };
  $("#term").onchange = (e) => { state.term = e.target.value; rerenderList(); };
  $("#source").onchange = (e) => { state.source = e.target.value; rerenderList(); };
  $("#sort").onchange = (e) => { state.sort = e.target.value; rerenderList(); };
  $("#newOnly").onchange = (e) => { state.newOnly = e.target.checked; rerenderList(); };
  wireCards();
}

function rerenderList() {
  const rows = filtered();
  $("#list").innerHTML = rows.length ? rows.map(card).join("") : `<div class="empty">Nothing here for these filters.</div>`;
  wireCards();
}

function findRow(id) {
  for (const rows of Object.values(state.rows)) { const r = (rows || []).find((x) => x.id === id); if (r) return r; }
}

function wireCards() {
  document.querySelectorAll(".card").forEach((el) => {
    const id = Number(el.dataset.id);
    el.querySelectorAll("[data-kind]").forEach((b) => (b.onclick = () => {
      el.querySelectorAll("[data-kind]").forEach((x) => x.classList.toggle("on", x === b));
    }));
    el.querySelectorAll("[data-act]").forEach((b) => (b.onclick = () => act(id, b.dataset.act, el)));
  });
}

async function act(id, action, el) {
  const r = findRow(id);
  if (action === "notfit" || action === "reason") { state.open = id; return rerenderList(); }
  if (action === "cancel") { state.open = null; return rerenderList(); }
  try {
    if (action === "applied") {
      await api("/api/act", { method: "POST", body: { ids: [id], action: "applied" } });
      moved(r, { user_status: "applied", applied_at: new Date().toISOString() }, "Marked as applied");
    } else if (action === "skip") {
      await api("/api/act", { method: "POST", body: { ids: [id], action: "skip" } });
      moved(r, { user_status: "skipped", feedback_at: new Date().toISOString() }, "Moved to Archive");
    } else if (action === "goodfit") {
      await api("/api/act", { method: "POST", body: { ids: [id], action: "good_fit" } });
      moved(r, { user_status: "good_fit", feedback_at: new Date().toISOString() }, "Marked as interested - moved to Matches");
    } else if (action === "save") {
      const reason = el.querySelector(".fb input").value.trim();
      if (r.user_status === "not_fit") {
        await api("/api/act", { method: "POST", body: { ids: [id], action: "reason", reason } });
        Object.assign(r, { feedback_reason: reason }); state.open = null; rerenderList();
        return toast("Reason saved");
      }
      const kind = el.querySelector("[data-kind].on")?.dataset.kind || "role";
      await api("/api/act", { method: "POST", body: { ids: [id], action: "not_fit", kind, reason } });
      state.open = null;
      moved(r, { user_status: "not_fit", feedback_kind: kind, feedback_reason: reason, feedback_at: new Date().toISOString() }, "Marked as not interested");
    } else if (action === "undo") {
      await api("/api/act", { method: "POST", body: { ids: [id], action: "undo" } });
      moved(r, { user_status: null, feedback_kind: null, feedback_reason: null, applied_at: null }, "Undone");
    }
  } catch (e) {
    if (e.message !== "signed out") toast(`Couldn't save: ${e.message}`);
  }
}

function moved(r, patch, msg) {
  const before = { user_status: r.user_status, feedback_kind: r.feedback_kind, feedback_reason: r.feedback_reason, applied_at: r.applied_at };
  Object.assign(r, patch);
  // Lists change membership; reload the others lazily.
  for (const k of Object.keys(state.rows)) if (k !== state.tab) delete state.rows[k];
  state.rows[state.tab] = state.rows[state.tab].filter((x) => x.id !== r.id || state.tab === "skipped" && !r.user_status);
  shell(); renderList(); loadCounts();
  if (patch.user_status !== null) {
    toast(msg, async () => {
      await api("/api/act", { method: "POST", body: { ids: [r.id], action: "undo" } });
      Object.assign(r, before);
      delete state.rows[state.tab]; await load(state.tab); renderList(); loadCounts();
    });
  } else toast(msg);
}

async function renderCoverage() {
  $("#body").innerHTML = `<div class="empty">Loading...</div>`;
  const st = state.status = await api("/api/status");
  const cov = st.coverage || [];
  const runs = st.runs || [];
  $("#body").innerHTML = `
    <h2 style="margin-top:0">Tracker status</h2>
    <p class="note">For each company tracked on its own careers site: how many of the roles found there Simplify also listed, and how many hours later on average (negative = Simplify was first). Counts only roles that appeared after tracking started.</p>
    ${cov.length ? `<div class="scroll"><table><tr><th>Company</th><th class="num">Found on site</th><th class="num">Also on Simplify</th><th class="num">Simplify lag</th></tr>
      ${cov.map((c) => `<tr><td>${esc(c.company)}</td><td class="num">${c.direct_postings}</td>
        <td class="num">${c.on_simplify} (${c.pct_on_simplify ?? 0}%)</td>
        <td class="num">${c.avg_lag_hours == null ? "-" : `${c.avg_lag_hours}h`}</td></tr>`).join("")}</table></div>`
      : `<div class="empty">No data yet - this fills in as new roles appear.</div>`}
    <h2>Recent runs</h2>
    <div class="scroll"><table><tr><th>Started</th><th class="num">New postings</th><th class="num">AI judged</th><th class="num">Notified</th><th>Problems</th></tr>
      ${runs.map((r) => { const s = r.summary || {}; const errs = Object.keys(s.source_errors || {});
        return `<tr><td>${new Date(r.started_at).toLocaleString()}</td><td class="num">${s.new_postings ?? "-"}</td>
        <td class="num">${s.judged ?? "-"}</td><td class="num">${s.notifications ?? "-"}</td>
        <td>${r.error ? `<span class="badge bad">Run failed</span>` : !r.finished_at ? "Running" : errs.length ? esc(errs.join(", ")) : "None"}</td></tr>`; }).join("")}
    </table></div>`;
}

async function start() {
  try {
    state.status = await api("/api/status");
    shell();
    loadCounts();
    if (state.tab === "status") return renderCoverage();
    await load(state.tab);
    renderList();
  } catch (e) {
    if (e.message !== "signed out") $("#app").innerHTML = `<div class="empty">Couldn't load: ${esc(e.message)}</div>`;
  }
}
start();
</script>
