# Companies you care about.
#
# Every company here is "on your radar": the AI treats it as a company you
# like when it rates how good a posting is. Companies with a `site` are
# also checked directly on their own careers site every run, so you hear
# about postings Simplify misses or lists late. Companies without one
# (custom-built, bot-protected careers sites) come through Simplify only.
#
# Any other company still reaches you through Simplify if the AI rates the
# posting a good fit - this list isn't a whitelist.
#
# To add a company:  python scripts/find_job_site.py "Company Name"
#
# site types: workday, greenhouse, lever, ashby, smartrecruiters, icims,
#             oracle, eightfold, successfactors, jibe, radancy
# aliases: other spellings Simplify uses for the company.

